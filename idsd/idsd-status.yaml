# IDSD 状态跟踪 — 由 planned-build 流程维护
# 查看进度：直接读本文件

workflow:
  type: planned-build
  project: graph-knowledge-base
  current_slice: slice-2-incremental-merge
  status: in_progress

slices:
  - id: slice-1-doc-to-graph
    name: 文档→图 + 可检索（含 trace 暴露口）
    status: completed
    depends_on: []
  - id: slice-2-incremental-merge
    name: 增量合并 + 实体对齐
    status: in_progress
    depends_on: [slice-1-doc-to-graph]
  - id: slice-3-retrieval-transparency
    name: 检索路径可视化（透明窗渲染）
    status: pending
    depends_on: [slice-1-doc-to-graph, slice-2-incremental-merge]
  - id: slice-4-graph-edit
    name: 图谱可视化 + 手工编辑
    status: pending
    depends_on: [slice-1-doc-to-graph]
  - id: slice-5-edit-loop
    name: 编辑回路（编辑 → 检索随之变化）
    status: pending
    depends_on: [slice-1-doc-to-graph, slice-3-retrieval-transparency, slice-4-graph-edit]

steps:
