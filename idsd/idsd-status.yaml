    name: 编写 Intent
    status: completed
    artifact: idsd/intents/slice-1-doc-to-graph/intent.md
  - id: 2
    name: 编写 Expectations
    status: completed
    artifact: idsd/intents/slice-1-doc-to-graph/expectations.md
  - id: 3
    name: 组装 Context
    status: completed
    artifact: idsd/context/context-bundle-slice-1-doc-to-graph.md
  - id: 4
    name: 规划实现路径
    status: completed
    artifact: idsd/plans/feature-list-slice-1-doc-to-graph.json
  - id: 5
    name: 逐切片构建
    status: completed
    note: 子切片①②③④ 全部完成并验证（骨架+provider抽象 / 文档→图 / 检索+trace / CLI+pytest 11测试通过）
  - id: 6
    name: 运行 Holdout 评估
    status: pending
  - id: 7
    name: 记录检查点
    status: pending
  - id: 8
    name: 用户验收
    status: pending

