[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphkb"
version = "0.1.0"
description = "Transparent, editable personal knowledge base: documents into a knowledge graph, with explainable retrieval hits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 图引擎：约束 1 要求复用 LightRAG。[api] extra 带来它的解析层
    # （lightrag.parser.legacy.extract_text）与 server 依赖。
    "lightrag-hku[api]>=1.5.6,<1.6",  # 1.5.7 已验证（doc_status 底层接口）；1.6 若再动，先让 CI 说话
    "httpx",
    "python-dotenv",
    # server 自己直接 import 的东西，不靠上游 extra 的副作用：
    "fastapi>=0.108",
    "uvicorn>=0.23",
    "python-multipart>=0.0.30",  # FastAPI 的 UploadFile/Form 必需（文件上传）
    # 文件解析库：LightRAG legacy 引擎按需 import，未由本项目直接 import，
    # 但缺一个就少一种格式，所以显式声明而不是只靠上游 extra 悄悄带进来。
    "pypdf>=6.1",
    "python-docx>=1",
    "python-pptx>=1",
    "openpyxl>=3",
]

[project.scripts]
graphkb = "graphkb.cli:main"
graphkb-mcp = "graphkb.mcp_server:main"

[project.urls]
Homepage = "https://github.com/fjibj/gk-visual"
Repository = "https://github.com/fjibj/gk-visual"
Issues = "https://github.com/fjibj/gk-visual/issues"

[project.optional-dependencies]
dev = ["pytest"]
# Agent 记忆面（MCP，stdio）。装法：pip install -e ".[dev,mcp]"
# 版本锁的依据（2026-11-04 实测，mcp 2.3.0）：
#   · mcp-types 的 HANDSHAKE_PROTOCOL_VERSIONS 含 "2025-11-25"（Cola 侧报的就是它）
#   · 裸 JSON-RPC 探针实测 initialize(2025-11-25) 原样回显、未降级
#   · 工具名合规字符集含点号（SEP-986：^[A-Za-z0-9._-]{1,128}$），memory.search 合法
# 2.x 把 FastMCP 改名 MCPServer（mcp.server.fastmcp 已删）；3.x 若再动协议，
# 让 mcp_server 的启动守卫与 tests/test_mcp.py 先报错，而不是等 agent 调不通才发现。
mcp = ["mcp>=2.3.0,<3"]

[tool.setuptools.packages.find]
include = ["graphkb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 需要真实 workspace 与本地 Ollama 的现场用例（CI 里自动 skip；`-m 'not slow'` 可跳过）",
]
