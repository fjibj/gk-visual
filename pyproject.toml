[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphkb"
version = "0.1.0"
description = "Transparent, editable personal knowledge base (IDSD slice-1)"
requires-python = ">=3.10"
dependencies = [
    "lightrag-hku",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["graphkb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Windows 沙箱下默认 temp 目录的 symlink 清理会 PermissionError，改用项目内 basetemp 规避
addopts = "--basetemp=.pytest_tmp"
