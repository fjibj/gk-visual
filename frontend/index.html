<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphKB 知识图谱</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span class="brand">GraphKB</span>
        <button id="btn-refresh">刷新</button>
        <button id="btn-add-entity">新建实体</button>
        <button id="btn-add-relation">新建关系</button>
        <button id="btn-merge">合并实体</button>
        <button id="btn-docs">文档</button>
        <input id="query-input" class="query-input" placeholder="检索问题..." />
        <button id="btn-query">检索</button>
        <span id="status" class="status"></span>
      </header>
      <main id="main">
        <div id="cy"></div>
        <div id="query-legend" class="hidden"></div>
        <aside id="panel" class="hidden">
          <div class="panel-head">
            <h2 id="panel-title"></h2>
            <button id="btn-close-panel" title="关闭">×</button>
          </div>
          <form id="panel-form"></form>
          <div id="panel-actions"></div>
        </aside>
        <aside id="answer-panel" class="hidden">
          <div class="panel-head" id="answer-head">
            <h2 id="answer-title">检索结果</h2>
            <button id="btn-close-answer" title="关闭">×</button>
          </div>
          <div id="answer-body"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
